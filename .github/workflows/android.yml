name: Build Fennec Player APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Apktool
        run: curl -L --fail --retry 3 -o /tmp/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar

      - name: Build APK
        run: java -jar /tmp/apktool.jar b . -o /tmp/unsigned.apk

      - name: Build diagnostic variant (original dex)
        run: |
          mkdir -p /tmp/v2 && cp tools/original_classes.dex /tmp/v2/classes.dex
          cp /tmp/unsigned.apk /tmp/unsigned_origdex.apk
          (cd /tmp/v2 && zip -q /tmp/unsigned_origdex.apk classes.dex)

      - name: Align and sign
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          keytool -genkeypair -keystore /tmp/ks.jks -storepass android -keypass android -alias key -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Fennec Player"
          mkdir -p out
          for n in unsigned:FennecPlayer unsigned_origdex:FennecPlayer_origdex; do
            src=${n%%:*}; dst=${n##*:}
            "$BT/zipalign" -f -p 4 /tmp/$src.apk /tmp/$src.aligned.apk
            "$BT/apksigner" sign --ks /tmp/ks.jks --ks-pass pass:android --key-pass pass:android --out out/$dst.apk /tmp/$src.aligned.apk
          done

      - uses: actions/upload-artifact@v4
        with:
          name: FennecPlayer-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 14
