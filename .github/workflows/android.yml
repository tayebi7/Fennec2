name: Build Fennec Player APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Apktool
        run: curl -L --fail --retry 3 -o /tmp/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar

      - name: Build APK
        run: java -jar /tmp/apktool.jar b . -o /tmp/unsigned.apk

      - name: Align and sign
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -f -p 4 /tmp/unsigned.apk /tmp/aligned.apk
          keytool -genkeypair -keystore /tmp/ks.jks -storepass android -keypass android -alias key -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Fennec Player"
          mkdir -p out
          "$BT/apksigner" sign --ks /tmp/ks.jks --ks-pass pass:android --key-pass pass:android --out out/FennecPlayer.apk /tmp/aligned.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FennecPlayer-apk
          path: out/FennecPlayer.apk
          if-no-files-found: error
          retention-days: 14
